name: avail - connection test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - connection_test.py
      - .github/workflows/connection.yml
permissions:
  contents: read
concurrency:
  group: avail-connection
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install selenium
      - name: Check public product pages
        run: python connection_test.py
