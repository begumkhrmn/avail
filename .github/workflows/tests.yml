name: avail - tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legacy/**'
      - '.github/workflows/tests.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest -v
